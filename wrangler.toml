# Main app Worker — TanStack Start fetch handler only.
#
# Cron / Queue responsibilities ship in three sibling Workers:
#   - wrangler.relay.toml     (Cron-driven outbox relay producer)
#   - wrangler.consumer.toml  (Queue consumer)
#   - wrangler.pruner.toml    (Cron-driven outbox pruner)
#
# `nodejs_compat` is required because @tanstack/react-start ships
# server-side code that imports `node:async_hooks`, `node:stream`,
# `node:crypto`, and `node:util`.
name = "tanstack-start-template"
# `pnpm deploy` runs `vite build` first; `dist/server/server.js` is the
# pre-bundled TanStack Start server entry (with all `tanstack-start-*:v`
# virtual modules already resolved). Pointing wrangler at the built
# artifact rather than `app/worker.ts` avoids re-bundling and the
# resulting "Could not resolve tanstack-start-manifest:v" failures.
main = "dist/server/server.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Static assets produced by `vite build` (`dist/client`).
[assets]
directory = "./dist/client"
binding = "ASSETS"

[vars]
APP_URL = "http://localhost:8787"

# D1: read/write for the request path. Outbox writes happen here
# transactionally with aggregate writes — see app/core/adapters/d1/.
[[d1_databases]]
binding = "DB"
database_name = "tanstack-start-template-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "app/core/adapters/d1/migrations"
