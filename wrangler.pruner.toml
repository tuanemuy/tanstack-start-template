# Outbox pruner Worker.
#
# Single responsibility: delete long-since-processed outbox rows on a
# daily cron. Quarantined rows (`failed_at IS NOT NULL`) are
# intentionally preserved for operator inspection.
#
# Only D1 is bound — the pruner has no need for the events Queue.
name = "tanstack-start-template-pruner"
main = "app/worker/pruner.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "http://localhost:8787"

[[d1_databases]]
binding = "DB"
database_name = "tanstack-start-template-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "app/core/adapters/d1/migrations"

[triggers]
crons = ["0 3 * * *"] # 03:00 UTC daily
