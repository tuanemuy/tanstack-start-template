# Outbox relay producer Worker.
#
# Single responsibility: claim pending outbox rows on a 1-minute cron
# and publish them to the events Queue. No fetch handler, no consumer
# wiring — just `scheduled` + D1 read/update + Queue producer.
#
# `nodejs_compat` covers `node:async_hooks` reachable through the
# application container's port boundaries.
name = "tanstack-start-template-relay"
main = "app/worker/relay.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "http://localhost:8787"

[[d1_databases]]
binding = "DB"
database_name = "tanstack-start-template-d1"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "app/core/adapters/d1/migrations"

[[queues.producers]]
binding = "EVENTS_QUEUE"
queue = "tanstack-start-template-events"

[triggers]
crons = ["*/1 * * * *"] # every minute
