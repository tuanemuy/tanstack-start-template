packages:
  - "apps/*"
  - "packages/*"
  - "infra/aws"
overrides:
  tinypool: 1.0.2
# `.d.ts` files inside the pnpm store resolve bare `react` / `vitest`
# type imports by walking up to the workspace root, so @types packages
# must stay visible there now that they are declared per-package.
publicHoistPattern:
  - "@types/*"
allowBuilds:
  esbuild: true
  workerd: true
  protobufjs: false
  sharp: false
